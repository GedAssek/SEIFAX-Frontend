<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentification — LEFAXEUR</title>
    <meta name="description" content="Connectez-vous ou créez votre compte LEFAXEUR pour accéder aux ressources étudiantes.">
    <link rel="stylesheet" href="../css/style.css?v=3">
    <link rel="stylesheet" href="../css/layout.css?v=3">
    <style>
        /* ── Auth layout ── */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem 1rem;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 460px;
        }

        /* ── Auth logo ── */
        .auth-logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .auth-logo img {
            height: 72px;
            width: auto;
            border-radius: 12px;
            object-fit: contain;
            background: #fff;
            padding: 6px;
            box-shadow: 0 4px 20px rgba(37,99,235,0.15);
        }
        .auth-logo p {
            color: var(--text-muted);
            font-size: 0.82rem;
            margin-top: 0.5rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* ── Auth card ── */
        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: 0 4px 24px rgba(15,23,42,0.08);
            padding: 2rem;
        }
        .auth-card h2 {
            font-size: 1.55rem;
            font-weight: 800;
            margin-bottom: 0.35rem;
        }

        /* ── 2-column grid (collapses on mobile) ── */
        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        /* ── Toggle link ── */
        .auth-toggle {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .auth-toggle a { font-weight: 700; color: var(--primary); }
        .auth-toggle a:hover { text-decoration: underline; }

        /* ── Password eye ── */
        .input-icon-wrap { position: relative; }
        .input-icon-wrap .form-control { padding-right: 3rem; }
        .eye-toggle {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text-muted);
            padding: 0.25rem;
            line-height: 1;
        }
        .eye-toggle:hover { color: var(--primary); }

        /* ── Loading state ── */
        .btn-submit.is-loading { cursor: wait; opacity: 0.85; }
        .btn-submit .button-content { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .button-spinner { width: 1rem; height: 1rem; border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff; border-radius: 50%; animation: auth-spin 0.75s linear infinite; }
        @keyframes auth-spin { to { transform: rotate(360deg); } }

        /* ── Submit button ── */
        .btn-submit { width: 100%; padding: 0.85rem; font-size: 0.95rem; margin-top: 0.5rem; }

        /* ── Animation ── */
        .auth-view { animation: fadeInUp 0.4s ease forwards; }

        /* ════ MOBILE ════════════════════════════════════════ */
        @media (max-width: 500px) {
            body { padding: 1rem 0.75rem; justify-content: flex-start; padding-top: 2rem; }
            .auth-wrapper { max-width: 100%; }
            .auth-card { padding: 1.4rem; border-radius: var(--radius-lg); }
            .auth-logo img { height: 56px; }
            .auth-logo { margin-bottom: 1rem; }
            .form-grid-2 { grid-template-columns: 1fr; gap: 0; }
            .auth-card h2 { font-size: 1.3rem; }
        }
    </style>
</head>
<body class="animate-fade-in">

    <div class="auth-wrapper">

        <!-- Logo -->
        <div class="auth-logo">
            <a href="../index.html">
                <img src="../assets/img/logo.jpg" alt="LEFAXEUR">
            </a>
            <p>Portail d'apprentissage</p>
        </div>

        <!-- ═══ Vue : CONNEXION ═══════════════════════════════════════ -->
        <div class="auth-card auth-view" id="login-view">
            <h2 class="text-center">Connexion</h2>
            <p class="text-center text-muted mb-2" style="font-size:0.92rem;">
                Entrez votre email et mot de passe pour accéder à la plateforme.
            </p>

            <form id="form-login" autocomplete="off">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" id="login-email" class="form-control"
                           required placeholder="votre@email.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Mot de passe</label>
                    <div class="input-icon-wrap">
                        <input type="password" name="password" id="login-password" class="form-control"
                               required placeholder="••••••••">
                        <button type="button" id="toggle-pw" class="eye-toggle" title="Afficher/Masquer">👁</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-submit"><span class="button-content">Se connecter</span></button>
            </form>

            <p class="auth-toggle">
                Pas encore de compte ? <a href="#" id="btn-to-register">S'inscrire</a>
            </p>
        </div>

        <!-- ═══ Vue : INSCRIPTION ════════════════════════════════════ -->
        <div class="auth-card auth-view hidden" id="register-view">
            <h2 class="text-center">Créer un compte</h2>
            <p class="text-center text-muted mb-2" style="font-size:0.92rem;">
                Rejoignez la communauté LEFAXEUR.
            </p>

            <form id="form-register" autocomplete="off">

                <!-- Nom & Prénom -->
                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="form-label">Nom</label>
                        <input type="text" name="nom" class="form-control" required placeholder="AYENA">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Prénom</label>
                        <input type="text" name="prenom" class="form-control" required placeholder="Gédéon">
                    </div>
                </div>

                <!-- Cycle & Année -->
                <div class="form-grid-2" id="reg-cycle-annee-group">
                    <div class="form-group">
                        <label class="form-label">Cycle</label>
                        <select name="cycle" class="form-control" required id="reg-cycle">
                            <option value="">Choisir...</option>
                            <!-- Populated by JS from SUBJECTS_DATA -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Année d'études</label>
                        <select name="annee" class="form-control" required id="reg-annee" disabled>
                            <option value="">Choisir...</option>
                            <option value="1">1ère Année</option>
                            <option value="2">2ème Année</option>
                            <option value="3">3ème Année</option>
                        </select>
                    </div>
                </div>

                <!-- Sexe & Promotion -->
                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="form-label">Sexe</label>
                        <select name="sexe" class="form-control" required id="reg-sexe">
                            <option value="">Sélectionnez</option>
                            <option value="M">Masculin</option>
                            <option value="F">Féminin</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Promotion</label>
                        <input type="text" name="promotion" class="form-control" required id="reg-promotion" placeholder="Ex: EAC SEI 2025 A">
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required placeholder="nom@eamac.aero">
                </div>

                <!-- Passwords -->
                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="form-label">Mot de passe</label>
                        <input type="password" name="password" id="reg-password" class="form-control"
                               required placeholder="≥ 8 caractères">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirmer</label>
                        <input type="password" name="password_confirm" id="reg-password-confirm"
                               class="form-control" required placeholder="Répéter">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-submit">Créer mon compte</button>
            </form>

            <p class="auth-toggle">
                Déjà un compte ? <a href="#" id="btn-to-login">Se connecter</a>
            </p>
        </div>

    </div>

    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ── Populate cycles from SUBJECTS_DATA ──────────────────────
            const cycleSelect = document.getElementById('reg-cycle');
            if (cycleSelect && typeof SUBJECTS_DATA !== 'undefined') {
                SUBJECTS_DATA.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.cycle;
                    opt.textContent = s.label;    // Juste le label propre, sans le code
                    cycleSelect.appendChild(opt);
                });
            }

            // ── Eye toggle ───────────────────────────────────────────────
            const toggleBtn = document.getElementById('toggle-pw');
            const pwInput   = document.getElementById('login-password');
            if (toggleBtn && pwInput) {
                toggleBtn.addEventListener('click', () => {
                    const isHidden = pwInput.type === 'password';
                    pwInput.type       = isHidden ? 'text' : 'password';
                    toggleBtn.textContent = isHidden ? '🙈' : '👁';
                });
            }
        });
    </script>
</body>
</html>
